<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>端末情報メモ</title>
  <style>
    body { font-family: sans-serif; margin: 16px; max-width: 900px; }
    button { margin-right: 8px; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; font-size: 14px; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; word-break: break-all; }
    pre { background: #f5f5f5; padding: 8px; overflow: auto; }
  </style>
</head>
<body>
  <h1>端末情報メモ</h1>
  <p>
    <input id="note" placeholder="メモ(任意)">
    <button id="recordBtn">今の端末を記録</button>
    <button id="sendBtn">未送信をクラウドへ送信</button>
    <button id="exportBtn">JSON表示</button>
    <button id="clearBtn">全削除</button>
  </p>
  <table>
    <thead><tr><th>日時</th><th>IP</th><th>機種(ヒント)</th><th>UserAgent</th><th>メモ</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <pre id="json" hidden></pre>

  <script src="device-memo.js"></script>
  <script>
    var rows = document.getElementById("rows");
    var jsonBox = document.getElementById("json");

    function cell(tr, text) {
      var td = document.createElement("td");
      td.textContent = text == null ? "" : text; // textContentで挿入しXSSを防ぐ
      tr.appendChild(td);
      return td;
    }

    function render() {
      rows.textContent = "";
      DeviceMemo.getAll().slice().reverse().forEach(function (e) {
        var tr = document.createElement("tr");
        cell(tr, e.recordedAt);
        cell(tr, e.ip || "(取得失敗)");
        cell(tr, e.clientHints ? e.clientHints.model || e.clientHints.platform : "(非対応)");
        cell(tr, e.userAgent);
        cell(tr, e.note);
        var del = document.createElement("button");
        del.textContent = "削除";
        del.onclick = function () { DeviceMemo.remove(e.id); render(); };
        cell(tr, "").appendChild(del);
        rows.appendChild(tr);
      });
    }

    document.getElementById("recordBtn").onclick = function () {
      var noteInput = document.getElementById("note");
      DeviceMemo.record(noteInput.value).then(function () { noteInput.value = ""; render(); });
    };
    document.getElementById("sendBtn").onclick = function () {
      DeviceMemo.sendPending().then(function (n) { alert(n + "件送信しました"); });
    };
    document.getElementById("exportBtn").onclick = function () {
      jsonBox.hidden = !jsonBox.hidden;
      jsonBox.textContent = DeviceMemo.exportJson();
    };
    document.getElementById("clearBtn").onclick = function () {
      if (confirm("記録を全て削除しますか?")) { DeviceMemo.clear(); render(); }
    };

    render();
  </script>
</body>
</html>
